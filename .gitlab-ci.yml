variables:
  GIT_SUBMODULE_STRATEGY: recursive
# so we get a version number with git describe
  GIT_DEPTH: 0
  LINBIT_DOCKER_REGISTRY: nexus.at.linbit.com:5000
  LINBIT_REGISTRY_URL: nexus.at.linbit.com:5000
  BUILD_HELPERS_VERSION: c0d39c0e5a2235262f21d072c4bf3b2dd62b2040
  VIRTER_VERSION: v1.0.0
  VMSHED_VERSION: v0.27.0

stages:
  - build
  - test

build1.2:
  stage: build
#  image: nexus.at.linbit.com:5000/windrbd-devenv
#  This has clang:
  image: nexus.at.linbit.com:5000/rainbow-devenv
  rules:
    - if: $CI_COMMIT_BRANCH == 'windrbd-1.2' || $CI_COMMIT_BRANCH == 'test-this-branch' || $CI_COMMIT_BRANCH == 'test-this-branch-with-drbd-9.3' || $CI_COMMIT_BRANCH == 'test-this-branch-with-diskless' || $CI_COMMIT_BRANCH == 'test-this-branch-with-connect5'
  script:
    - |
      export PATH=/root/.zeranoe/mingw-w64/x86_64/bin:/root/.zeranoe/mingw-w64/cygwin-x86_64/bin:/root/.zeranoe/mingw-w64/i686/bin:$PATH
      if [ $CI_COMMIT_BRANCH == 'test-this-branch-with-drbd-9.3' ] ; then export DRBD=drbd-9.3 ; fi
      if [ $CI_COMMIT_BRANCH == 'test-this-branch-with-connect5' ] ; then export USE_CLANG=1 ; export DRBD=drbd-9.3 ; fi
      make package VERSION=windrbd-1.2-from-gitlab
    - |
      for i in inno-setup/install-windrbd-*.exe
      do
          echo copiing $i to nexus ...
          curl -f -isSf -u $LINBIT_REGISTRY_USER:$LINBIT_REGISTRY_PASSWORD --upload-file $i https://nexus.at.linbit.com/repository/windows/WinDRBD/install-windrbd-$CI_COMMIT_BRANCH-from-gitlab.exe
      done

  artifacts:
    paths:
      - inno-setup/install*.exe
    when: always

build1.1:
   stage: build
   image: $LINBIT_DOCKER_REGISTRY/build-windrbd-1.1
   rules:
     - if: $CI_COMMIT_BRANCH == 'windrbd-1.1'
   script:
     - ./build-windrbd.sh

test:
  tags:
    - libvirt
  stage: test
  rules:
    - if: $CI_COMMIT_BRANCH == 'windrbd-1.1' || $CI_COMMIT_BRANCH == 'windrbd-1.2' || $CI_COMMIT_BRANCH == 'test-this-branch' || $CI_COMMIT_BRANCH == 'test-this-branch-with-drbd-9.3' || $CI_COMMIT_BRANCH == 'test-this-branch-with-diskless' || $CI_COMMIT_BRANCH == 'test-this-branch-with-connect5'
  script: |
    git init build-helpers -q -b unused
    git -C build-helpers fetch -q --depth 1 $CI_SERVER_PROTOCOL://gitlab-ci-token:${CI_JOB_TOKEN}@$CI_SERVER_HOST:$CI_SERVER_PORT/linbit/build-helpers.git $BUILD_HELPERS_VERSION
    git -C build-helpers checkout -q $BUILD_HELPERS_VERSION

    . build-helpers/gitlab-utils.sh
    ci_prepare_tools
    ci_fetch_rq
    ci_fetch_binary virter virter-$VIRTER_VERSION https://github.com/LINBIT/virter/releases/download/$VIRTER_VERSION/virter-linux-amd64
    virter --version
    ci_fetch_binary vmshed vmshed-$VMSHED_VERSION https://github.com/LINBIT/vmshed/releases/download/$VMSHED_VERSION/vmshed-linux-amd64
    vmshed --version
    git clone --branch jt/working-branch https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/drbd/drbd9-tests.git
    export WINDRBD_VERSION=$CI_COMMIT_BRANCH-from-gitlab
    cd drbd9-tests && echo "git hash of DRBD9 tests is $( git rev-parse HEAD )" && ../run-windrbd-tests-ci-$CI_COMMIT_BRANCH.sh
  artifacts:
    # provide a convenient name so that the downloaded artifacts can be identified
    name: $CI_PROJECT_NAME-$CI_JOB_ID
    paths:
      - drbd9-tests/tests-out/
    when: always
    reports:
      junit: tests-out/test-results/*.xml
